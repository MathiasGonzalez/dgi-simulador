services:
  dgi-simulador:
    # La imagen publicada; con `docker compose up --build` se compila desde este repositorio.
    image: ghcr.io/mathiasgonzalez/dgi-simulador:latest
    build: .
    ports:
      - "8080:8080"
    volumes:
      - datos:/datos
      # Para cargar emisores, certificados y CAE al arrancar:
      # - ./semilla.ejemplo.json:/semilla/semilla.json:ro
    environment:
      Simulador__DemoraConsultaSegundos: "2"
      # Simulador__Semilla: /semilla/semilla.json
      # Simulador__Estricto: "true"
      # Simulador__UnidadIndexada__2025: "6.4"
      # Simulador__UrlEntregaCorreo: http://host.docker.internal:8787/cdn-cgi/handler/email

volumes:
  datos:
